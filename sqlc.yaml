version: "2"
sql:
  - engine: postgresql
    queries: internal/repositories/user/queries
    schema: assets/migrations/user
    gen:
      go:
        package: sqlc
        sql_package: pgx/v5
        out: internal/repositories/user/sqlc
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: pg_catalog.serial4
            go_type: int
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: date
            go_type: time.Time
          - db_type: pg_catalog.time
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
